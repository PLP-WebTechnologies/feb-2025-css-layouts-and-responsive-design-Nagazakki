<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox Webpage</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
    }
    header {
      background: #2a3d66;
      color: #fff;
      padding: 1rem;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: background 0.2s;
    }
    nav a:hover {
      background: #1b2747;
    }

    /* Flexbox layout for main content */
    .flex-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 60vh;
    }
    aside {
      background: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
      min-width: 150px;
      flex: 1 1 150px;
      max-width: 250px;
    }
    main {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      flex: 3 1 400px;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .cards {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .card {
      flex: 1 1 200px;
      background: #f1f1f1;
      padding: 1rem;
      border-radius: 6px;
      text-align: center;
      min-width: 150px;
    }
    footer {
      background: #2a3d66;
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 20px;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .flex-container {
        flex-direction: column;
        gap: 0;
        padding: 10px;
      }
      aside {
        max-width: none;
        min-width: 0;
        margin-bottom: 1rem;
      }
      aside:last-child {
        display: none;
      }
      main {
        min-width: 0;
      }
    }
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }
      .cards {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div><strong>Logo</strong></div>
      <div>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>
  </header>
  <div class="flex-container">
    <aside>Sidebar Left</aside>
    <main>
      <h1>Responsive Flexbox Webpage</h1>
      <div class="cards">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
      </div>
    </main>
    <aside>Sidebar Right</aside>
  </div>
  <footer>
    &copy; 2025 Responsive Flexbox Example
  </footer>
</body>
</html>
